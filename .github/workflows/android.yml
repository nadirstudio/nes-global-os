name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Project, Build Web Assets & Sync Capacitor
        run: |
          PKG_DIR=$(find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Found package.json in: $PKG_DIR"
          cd "$PKG_DIR"
          npm install
          npm run build
          npx cap sync android

      - name: Build Release APK with Gradle
        run: |
          ANDROID_DIR=$(find . -maxdepth 5 -name "gradlew" | head -n 1 | xargs dirname)
          echo "Found gradlew in: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/app/build/outputs/apk/release/*.apk"
